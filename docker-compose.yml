version: '3.8'

services:
  mysql:
    image: mysql:8.0.26
    container_name: mine_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Root123456!}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mine_hazard}
      MYSQL_USER: ${MYSQL_USER:-mine}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-Mine123456!}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./sql/data.sql:/docker-entrypoint-initdb.d/02-data.sql
    ports:
      - "3306:3306"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pRoot123456!"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: always
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+08:00
      --max_allowed_packet=64M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mine_backend
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-mine_hazard}?useUnicode=true&characterEncoding=utf8mb4&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-mine}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-Mine123456!}
      JWT_SECRET: ${JWT_SECRET:-mineHazardSecretKey2026VeryLongSecureHS256AlgorithmMustBe256Bits}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
    ports:
      - "8080:8080"
    networks:
      - app-network
    depends_on:
      mysql:
        condition: service_healthy
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mine_frontend
    ports:
      - "80:80"
    networks:
      - app-network
    depends_on:
      - backend
    restart: always

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
